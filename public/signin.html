<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sign In &middot; LostLink</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/css/shared.css"
  >

  <link
    rel="stylesheet"
    href="/css/profile.css"
  >

  <style>
    .signin-page {
      min-height:calc(100vh - 130px);
      background:#f5f6f1;
      padding:65px 24px;
      display:flex;
      justify-content:center;
      align-items:flex-start
    }

    .signin-card {
      width:100%;
      max-width:500px;
      background:#fff;
      border:1px solid #e4e9e2;
      border-radius:11px;
      padding:45px;
      box-shadow:0 14px 35px #14203c10
    }

    .signin-card .eyebrow {
      justify-content:center
    }

    .signin-card h1 {
      margin:12px 0 8px;
      text-align:center;
      font:700 38px "Playfair Display";
      color:#15223a
    }

    .signin-subtitle {
      text-align:center;
      color:#6d7780;
      font-size:14px;
      line-height:1.6;
      margin-bottom:30px
    }

    .signin-avatar {
      display:grid;
      place-items:center;
      width:67px;
      height:67px;
      border-radius:50%;
      background:#f5896a;
      color:white;
      margin:12px auto;
      font-size:25px
    }

    .signin-field {
      margin-bottom:18px
    }

    .signin-field label {
      display:block;
      margin-bottom:7px;
      font-size:12px;
      font-weight:700;
      color:#26344c
    }

    .signin-field input {
      width:100%;
      box-sizing:border-box;
      padding:13px 14px;
      border:1px solid #dfe4de;
      border-radius:7px;
      background:#fafbf8;
      color:#18263e;
      font:500 13px "DM Sans";
      outline:none;
      transition:.2s
    }

    .signin-field input:focus {
      background:#fff;
      border-color:#f18565;
      box-shadow:0 0 0 3px #f1856518
    }

    .signin-field small {
      display:block;
      min-height:16px;
      margin-top:5px;
      font-size:11px;
      color:#c65342
    }

    .password-wrap {
      position:relative
    }

    .password-wrap input {
      padding-right:65px
    }

    .password-wrap button {
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:none;
      color:#c65f43;
      font-weight:700;
      cursor:pointer
    }

    .signin-submit {
      width:100%;
      justify-content:center;
      margin-top:5px
    }

    .google-signin-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid #dce2dc;
      border-radius: 8px;
      background: #ffffff;
      color: #273746;
      font: 600 14px "DM Sans", sans-serif;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(23, 33, 58, 0.05);
      transition: all 0.2s ease;
    }

    .google-signin-btn:hover {
      background: #f8faf7;
      border-color: #cbd4cb;
      box-shadow: 0 4px 12px rgba(23, 33, 58, 0.09);
      transform: translateY(-1px);
    }

    .google-signin-btn:active {
      transform: translateY(0);
    }

    .google-signin-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      margin: 22px 0 18px;
      color: #8c9791;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e7e0;
    }

    .auth-divider span {
      padding: 0 12px;
    }

    .auth-mode-tabs {
      display: flex;
      border: 1px solid #dfe4de;
      border-radius: 8px;
      margin-bottom: 20px;
      background: #f3f5f1;
      padding: 3px;
    }

    .auth-mode-tab {
      flex: 1;
      border: none;
      background: none;
      padding: 8px 12px;
      border-radius: 6px;
      font: 600 12px "DM Sans", sans-serif;
      color: #5d6770;
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-mode-tab.active {
      background: #fff;
      color: #17243c;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .input-error {
      border-color:#d96352!important;
      background:#fff8f6!important
    }

    .input-success {
      border-color:#79a384!important
    }

    .signin-back {
      display:block;
      text-align:center;
      margin-top:18px;
      color:#68737c;
      font-size:13px;
      text-decoration:none
    }

    .signin-back:hover {
      color:#f18565
    }

    @media(max-width:600px) {
      .signin-card {
        padding:32px 22px
      }

      .signin-card h1 {
        font-size:32px
      }
    }
  </style>
</head>

<body>

  <header class="topbar">

    <a class="brand" href="index.html">
      <span class="brand-mark">L</span>

      <span>
        campus<span>found</span>
      </span>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#browse">Browse</a>
      <a href="map.html">Campus map</a>
      <a href="how-it-works.html">How it works</a>
    </nav>

    <a
      class="profile-btn profile-nav"
      href="profile.html"
    >
      <span class="profile-dot">&#9673;</span>
      <span>Profile</span>
    </a>

  </header>

  <main class="signin-page">

    <section class="signin-card">

      <p class="eyebrow">
        <span></span>
        LostLink ACCOUNT
      </p>

      <div class="signin-avatar">
        &#9673;
      </div>

      <h1>Welcome back.</h1>

      <p class="signin-subtitle">
        Sign in with Google or your university account to continue.
      </p>

      <!-- Google Sign In Button -->
      <button
        type="button"
        id="googleSignInBtn"
        class="google-signin-btn"
      >
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.347 2.825.957 4.039l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
        </svg>
        <span id="googleBtnText">Continue with Google</span>
      </button>

      <div class="auth-divider">
        <span>or use email</span>
      </div>

      <div class="auth-mode-tabs">
        <button type="button" class="auth-mode-tab active" id="tabSignIn">Sign in</button>
        <button type="button" class="auth-mode-tab" id="tabSignUp">Create account</button>
      </div>

      <form
        id="studentLoginForm"
        novalidate
      >

        <div class="signin-field">

          <label for="studentName">
            Full name <small style="font-weight:400;color:#77828c">(only needed the first time)</small>
          </label>

          <input
            type="text"
            id="studentName"
            placeholder="Enter your full name"
            autocomplete="name"
          >

          <small id="nameError"></small>

        </div>

        <div class="signin-field">

          <label for="studentEmail">
            University email
          </label>

          <input
            type="email"
            id="studentEmail"
            placeholder="name@chitkara.edu.in"
            autocomplete="email"
          >

          <small id="emailError"></small>

        </div>

        <div class="signin-field">

          <label for="studentPassword">
            Password
          </label>

          <div class="password-wrap">

            <input
              type="password"
              id="studentPassword"
              placeholder="Enter your password"
              autocomplete="current-password"
            >

            <button
              type="button"
              id="togglePassword"
            >
              Show
            </button>

          </div>

          <small id="passwordError"></small>

        </div>

        <button
          type="submit"
          class="btn btn-dark signin-submit"
        >
          Sign in <b>&rarr;</b>
        </button>

      </form>

      <a
        class="signin-back"
        href="profile.html"
      >
        &larr; Back to profile
      </a>

    </section>

  </main>

  <footer>
    <span>
      &copy; 2026 LostLink &middot; Chitkara University
    </span>

    <span>
      Campus lost & found
    </span>
  </footer>

  <div id="toast"></div>

  <!-- Firebase App & Auth SDKs (Compat CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <script src="/js/shared.js"></script>
  <script src="/js/signin.js"></script>

</body>
</html>
