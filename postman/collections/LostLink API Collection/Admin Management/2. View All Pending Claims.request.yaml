$kind: http-request
description: Lists claims with full verification answers and claimant info for admin review.
url: "{{baseUrl}}/api/admin/claims?status=pending"
method: GET
queryParams:
  status: pending
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.claims && res.claims.length > 0) {
          pm.collectionVariables.set('claimId', res.claims[0].id);
      }
    language: text/javascript
order: 2000
